{% load static %}
{% load text_tags %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resgatos — Início</title>
    <link rel="stylesheet" href="{% static 'vendor/tabler/css/tabler.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/tabler/css/tabler-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
<div class="resgatos-layout">

    <!-- SIDEBAR -->
    <aside class="resgatos-sidebar">

        <!-- LOGO-->
        <div class="resgatos-brand">
            <a href="#" target="_blank" class="resgatos-brand-link" aria-label="Resgatos">
                <span class="resgatos-brand-content">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M20 3v10a8 8 0 1 1 -16 0v-10l3.432 3.432a7.963 7.963 0 0 1 4.568 -1.432c1.769 0 3.403 .574 4.728 1.546l3.272 -3.546" />
                        <path d="M2 16h5l-4 4" />
                        <path d="M22 16h-5l4 4" />
                        <path d="M11 16a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                        <path d="M9 11v.01" />
                        <path d="M15 11v.01" />
                    </svg>
                </span>
            </a>
        </div>

        <!-- MENU -->
        <nav class="resgatos-sidebar-nav" aria-label="Navegação principal">

            <!-- INICIO -->
            <a href="{% url 'inicio' %}" class="resgatos-nav-item" aria-label="Inicio" title="Início">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M5 12l7-7 7 7"/>
                        <path d="M9 21v-6h6v6"/>
                        <path d="M5 12v9h14v-9"/>
                    </svg>
                </span>
            </a>

          <div class="resgatos-nav-separator"></div>

            <!-- PESSOAS -->
            <a href="{% url 'pessoas:lista' %}" class="resgatos-nav-item" aria-label="Pessoas" title="Pessoas">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="9" cy="7" r="4"/>
                        <path d="M3 21v-2a6 6 0 0 1 12 0v2"/>
                        <path d="M16 4.5a4 4 0 0 1 0 7"/>
                        <path d="M19 21v-2a6 6 0 0 0-4-5.65"/>
                    </svg>
                </span>
            </a>

            <!-- PETS -->
            <a href="{% url 'pets:lista' %}" class="resgatos-nav-item" aria-label="Pets" title="Pets">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M12 10c-1.32 0 -1.983 .421 -2.931 1.924l-.244 .398l-.395 .688a50.89 50.89 0 0 0 -.141 .254c-.24 .434 -.571 .753 -1.139 1.142l-.55 .365c-.94 .627 -1.432 1.118 -1.707 1.955c-.124 .338 -.196 .853 -.193 1.28c0 1.687 1.198 2.994 2.8 2.994l.242 -.006c.119 -.006 .234 -.017 .354 -.034l.248 -.043l.132 -.028l.291 -.073l.162 -.045l.57 -.17l.763 -.243l.455 -.136c.53 -.15 .94 -.222 1.283 -.222c.344 0 .753 .073 1.283 .222l.455 .136l.764 .242l.569 .171l.312 .084c.097 .024 .187 .045 .273 .062l.248 .043c.12 .017 .235 .028 .354 .034l.242 .006c1.602 0 2.8 -1.307 2.8 -3c0 -.427 -.073 -.939 -.207 -1.306c-.236 -.724 -.677 -1.223 -1.48 -1.83l-.257 -.19l-.528 -.38c-.642 -.47 -1.003 -.826 -1.253 -1.278l-.27 -.485l-.252 -.432c-1.011 -1.696 -1.618 -2.099 -3.053 -2.099z" />
                        <path d="M19.78 7h-.03c-1.219 .02 -2.35 1.066 -2.908 2.504c-.69 1.775 -.348 3.72 1.075 4.333c.256 .109 .527 .163 .801 .163c1.231 0 2.38 -1.053 2.943 -2.504c.686 -1.774 .34 -3.72 -1.076 -4.332a2.05 2.05 0 0 0 -.804 -.164z" />
                        <path d="M9.025 3c-.112 0 -.185 .002 -.27 .015l-.093 .016c-1.532 .206 -2.397 1.989 -2.108 3.855c.272 1.725 1.462 3.114 2.92 3.114l.187 -.005a1.26 1.26 0 0 0 .084 -.01l.092 -.016c1.533 -.206 2.397 -1.989 2.108 -3.855c-.27 -1.727 -1.46 -3.114 -2.92 -3.114z" />
                        <path d="M14.972 3c-1.459 0 -2.647 1.388 -2.916 3.113c-.29 1.867 .574 3.65 2.174 3.867c.103 .013 .2 .02 .296 .02c1.39 0 2.543 -1.265 2.877 -2.883l.041 -.23c.29 -1.867 -.574 -3.65 -2.174 -3.867a2.154 2.154 0 0 0 -.298 -.02z" />
                        <path d="M4.217 7c-.274 0 -.544 .054 -.797 .161c-1.426 .615 -1.767 2.562 -1.078 4.335c.563 1.451 1.71 2.504 2.941 2.504c.274 0 .544 -.054 .797 -.161c1.426 -.615 1.767 -2.562 1.078 -4.335c-.563 -1.451 -1.71 -2.504 -2.941 -2.504z" />
                    </svg>
                </span>
            </a>

            <!-- RESGATES -->
            <a href="{% url 'resgates:lista' %}" class="resgatos-nav-item" aria-label="Resgates" title="Resgates">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M5 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                        <path d="M15 17a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                        <path d="M5 17h-2v-11a1 1 0 0 1 1 -1h9v12m-4 0h6m4 0h2v-6h-8m0 -5h5l3 5" />
                        <path d="M6 10h4m-2 -2v4" />
                    </svg>
                </span>
            </a>

            <!-- ATENDIMENTO -->
            <a href="{% url 'atendimentos:lista' %}" class="resgatos-nav-item" aria-label="Atendimento" title="Atendimento">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M6 4h-1a2 2 0 0 0 -2 2v3.5a5.5 5.5 0 0 0 11 0v-3.5a2 2 0 0 0 -2 -2h-1" />
                        <path d="M8 15a6 6 0 1 0 12 0v-3" />
                        <path d="M11 3v2" />
                        <path d="M6 3v2" />
                        <path d="M18 10a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                    </svg>
                </span>
            </a>

          <div class="resgatos-nav-separator"></div>

            <!-- ESTOQUE -->
            <a href="{% url 'estoque:lista' %}" class="resgatos-nav-item" aria-label="Estoque" title="Estoque">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
	                    <path d="M20.894 17.553a1 1 0 0 1 -.447 1.341l-8 4a1 1 0 0 1 -.894 0l-8 -4a1 1 0 0 1 .894 -1.788l7.553 3.774l7.554 -3.775a1 1 0 0 1 1.341 .447m0 -4a1 1 0 0 1 -.447 1.341l-8 4a1 1 0 0 1 -.894 0l-8 -4a1 1 0 0 1 .894 -1.788l7.552 3.775l7.554 -3.775a1 1 0 0 1 1.341 .447m0 -4a1 1 0 0 1 -.447 1.341l-8 4a1 1 0 0 1 -.894 0l-8 -4a1 1 0 0 1 .894 -1.788l7.552 3.775l7.554 -3.775a1 1 0 0 1 1.341 .447m-8.887 -8.552q .056 0 .111 .007l.111 .02l.086 .024l.012 .006l.012 .002l.029 .014l.05 .019l.016 .009l.012 .005l8 4a1 1 0 0 1 0 1.788l-8 4a1 1 0 0 1 -.894 0l-8 -4a1 1 0 0 1 0 -1.788l8 -4l.011 -.005l.018 -.01l.078 -.032l.011 -.002l.013 -.006l.086 -.024l.11 -.02l.056 -.005z" />
                    </svg>
                </span>
            </a>

            <!-- FORNECEDORES -->
            <a href="{% url 'fornecedores:lista' %}" class="resgatos-nav-item" aria-label="Fornecedores" title="Fornecedores">
                <span class="resgatos-nav-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <path d="M3 21l18 0" />
                        <path d="M3 7v1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1m0 1a3 3 0 0 0 6 0v-1h-18l2 -4h14l2 4" />
                        <path d="M5 21l0 -10.15" />
                        <path d="M19 21l0 -10.15" />
                        <path d="M9 21v-4a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v4" />
                    </svg>
                </span>
            </a>

        </nav>

        <!-- FLEX SPACE -->
        <div class="resgatos-sidebar-spacer"></div>

    </aside>

    <!-- MAIN -->
    <div class="resgatos-main">

        <!-- TOPBAR -->
        <header class="resgatos-topbar">

            <div class="resgatos-topbar-left">
                <img src="{% static 'img/common/logo-resgatos.png' %}" alt="Logo Resgatos">

                <button type="button" class="resgatos-mobile-menu" aria-label="Abrir menu">
                    <svg viewBox="0 0 24 24"
                         aria-hidden="true">
                        <path d="M4 6h16"/>
                        <path d="M4 12h16"/>
                        <path d="M4 18h16"/>
                    </svg>
                </button>
            </div>

            <div class="resgatos-topbar-right">

                <!-- USER -->
                <div class="resgatos-user">
                    <div class="resgatos-avatar resgatos-avatar-top">
                        {{ request.user.pessoa.nome|initials }}
                    </div>
                    <div class="resgatos-user-info">
                        <strong>
                            {{ request.user.pessoa.nome }}
                        </strong>
                        <span>Sistema de Gestão</span>
                    </div>
                    <button type="button" class="resgatos-user-arrow nav-item dropdown-toggle" data-bs-toggle="dropdown" data-bs-auto-close="true" aria-expanded="false"></button>

                    <div class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" data-bs-popper="static">
                        <a class="dropdown-item" href="#">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false" class="icon dropdown-item-icon">
                                <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0"></path>
                                <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2"></path>
                            </svg>
                            Meu Perfil
                        </a>
                      <div class="dropdown-divider"></div>
                        <a class="dropdown-item" href="#">
                          <form method="post" action="{% url 'logout' %}">
                              {% csrf_token %}
                              <button type="submit" class="dropdown-item">
                                  Sair
                              </button>
                          </form>
                        </a>
                    </div>

                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="resgatos-content">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>

<script src="{% static 'vendor/tabler/js/tabler.js' %}"></script>
<script src=""></script>

</body>
</html>
